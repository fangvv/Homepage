name: Update V2Ray Subscription

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/v2ray.yml'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Print trigger info
        run: |
          echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Beijing time: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "event_name=${{ github.event_name }}"

      - name: Pull latest changes from remote
        run: git pull origin master --rebase

      - name: Download, merge, deduplicate and probe subscriptions
        shell: python
        run: |
          import asyncio
          import base64
          import re
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          urls = [
              "https://raw.githubusercontent.com/xiaoji235/airport-free/main/v2ray.txt",
              "https://raw.githubusercontent.com/thirtysixpw/v2ray-reaper/main/normal/mix",
              "https://raw.githubusercontent.com/crackbest/V2ray-Config/refs/heads/main/config.txt",
              "https://raw.githubusercontent.com/snakem982/proxypool/main/source/v2ray-2.txt",
              "https://raw.githubusercontent.com/alireza786786/Free-V2ray-Configs/refs/heads/main/servers/vless_servers.txt",
              "https://raw.githubusercontent.com/kort0881/vpn-vless-configs-russia/refs/heads/main/output/vless.txt",
              "https://raw.githubusercontent.com/wiki/gfpcom/free-proxy-list/lists/vless.txt",
          ]

          # 仅导入 vless;其余协议已注释停用,需要时直接取消注释即可
          # 注意:Xray 的 trojan 同样支持 REALITY,取消 trojan 注释即可一并导入
          schemes = (
              # "ss://",
              # "ssr://",
              # "vmess://",
              "vless://",
              # "trojan://",
              # "hysteria://",
              # "hysteria2://",
              # "hy2://",
              # "tuic://",
          )

          # 只保留使用 REALITY 的节点(链接查询串里的 security=reality)
          # 用正则在查询串里匹配,避免 urlparse 对 [1.2.3.4] 这类畸形 host 抛 ValueError
          def is_reality(node):
              match = re.search(r"[?&]security=([^&#]*)", node)
              return match is not None and match.group(1).lower() == "reality"

          def try_decode_base64(text):
              compact = re.sub(r"\s+", "", text)
              if not compact:
                  return text
              padding = "=" * (-len(compact) % 4)
              try:
                  decoded = base64.b64decode(compact + padding, validate=False).decode("utf-8", errors="ignore")
              except Exception:
                  return text
              if any(scheme in decoded for scheme in schemes):
                  return decoded
              return text

          # 探测参数:并发数与单节点超时(秒)
          PROBE_CONCURRENCY = 300
          PROBE_TIMEOUT = 3

          def endpoint_of(node):
              # 取出 vless 链接里的 host:port,用于 TCP 连通性探测
              match = re.match(r"vless://[^@]+@(\[[^\]]+\]|[^:/?#]+):(\d+)", node)
              if not match:
                  return None
              return (match.group(1).strip("[]"), int(match.group(2)))

          async def probe(host, port, semaphore):
              async with semaphore:
                  writer = None
                  try:
                      started = time.perf_counter()
                      _, writer = await asyncio.wait_for(
                          asyncio.open_connection(host, port), timeout=PROBE_TIMEOUT
                      )
                      return (host, port), time.perf_counter() - started
                  except Exception:
                      return (host, port), None
                  finally:
                      if writer is not None:
                          try:
                              writer.close()
                          except Exception:
                              pass

          def probe_endpoints(endpoints):
              # 同一 host:port 只探测一次,返回 {endpoint: 握手耗时}
              async def run():
                  semaphore = asyncio.Semaphore(PROBE_CONCURRENCY)
                  results = await asyncio.gather(*(probe(h, p, semaphore) for h, p in endpoints))
                  return {endpoint: elapsed for endpoint, elapsed in results if elapsed is not None}

              return asyncio.run(run())

          nodes = []
          seen = set()

          for url in urls:
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "GitHub Actions"})
                  with urllib.request.urlopen(request, timeout=60) as response:
                      content = response.read().decode("utf-8", errors="ignore")
              except Exception as error:
                  print(f"Failed to download {url}: {error}")
                  continue

              content = try_decode_base64(content)
              for line in content.splitlines():
                  node = line.strip()
                  if not node or node.startswith("#"):
                      continue
                  if not node.startswith(schemes):
                      continue
                  if not is_reality(node):
                      continue
                  if node in seen:
                      continue
                  seen.add(node)
                  nodes.append(node)

          # TCP 连通性过滤:剔除域名失效 / 端口不通的死节点(类似客户端延迟测试的第一道筛子)
          endpoints = {}
          for node in nodes:
              endpoint = endpoint_of(node)
              if endpoint is not None:
                  endpoints[endpoint] = None

          alive = probe_endpoints(list(endpoints))
          kept = [node for node in nodes if endpoint_of(node) in alive]
          kept.sort(key=lambda node: alive[endpoint_of(node)])
          print(f"Probed {len(endpoints)} endpoints, alive {len(alive)}, kept {len(kept)}/{len(nodes)} nodes")

          # 防护:探测结果异常(如 runner 出网故障)时不要覆盖已有文件
          if nodes and len(kept) < max(10, len(nodes) * 0.02):
              raise SystemExit(
                  f"Abort: only {len(kept)} of {len(nodes)} nodes passed the probe, keeping existing v2ray.txt"
              )

          output = Path("v2ray.txt")
          output.unlink(missing_ok=True)
          generated_at = datetime.now(timezone.utc).isoformat()
          output.write_text(f"# Generated at {generated_at}\n" + "\n".join(kept) + ("\n" if kept else ""), encoding="utf-8")
          print(f"Merged {len(kept)} unique nodes into {output}")

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2ray.txt
          git commit --allow-empty -m "Update merged v2ray subscription"
          git push
